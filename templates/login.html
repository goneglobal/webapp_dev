{% extends "base.html" %}

{% block title %}Login - Flask HTMX App{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="fas fa-sign-in-alt"></i> Login
            </h4>
        </div>
        <div class="card-body">
            <form hx-post="{{ url_for('login') }}" 
                  hx-target="#message-area" 
                  hx-indicator="#loading-indicator">
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           placeholder="Enter your username">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           name="password" 
                           required 
                           autocomplete="current-password"
                           placeholder="Enter your password">
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <span id="loading-indicator" class="loading-indicator">
                            Logging in...
                        </span>
                        <span>Login</span>
                    </button>
                </div>
            </form>
            
            <!-- Message area for HTMX responses -->
            <div id="message-area" class="mt-3"></div>
        </div>
        <div class="card-footer text-muted">
            <small>
                <strong>Demo Users:</strong><br>
                admin / password123<br>
                user / userpass<br>
                demo / demo
            </small>
        </div>
    </div>
</div>

<script>
    // Add some enhancements for better UX
    document.addEventListener('DOMContentLoaded', function() {
        // Focus on username field when page loads
        document.getElementById('username').focus();
        
        // Clear message area when user starts typing
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                const messageArea = document.getElementById('message-area');
                if (messageArea.innerHTML.trim() !== '') {
                    messageArea.innerHTML = '';
                }
            });
        });
    });
</script>
{% endblock %}
